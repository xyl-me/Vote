name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-and-ui-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 用 docker compose 起服务：既跑测试，也顺带验证「clone 后一键跑通」这条路径
      - name: 一键启动服务（docker compose）
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health; then
              echo "服务已就绪"
              exit 0
            fi
            sleep 3
          done
          echo "::error::服务在 180 秒内未就绪"
          docker compose ps
          docker compose logs --no-color --tail 100
          exit 1

      - name: 安装测试依赖与浏览器
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: 运行接口 + UI 自动化测试
        # 用例失败 → 本步骤失败 → CI 变红（阻断）；后续步骤用 if: always() 保证仍产出报告
        env:
          BASE_URL: http://localhost:8000
        run: |
          pytest --alluredir=allure-results \
                 --screenshot=only-on-failure \
                 --full-page-screenshot \
                 --tracing=retain-on-failure \
                 --output=test-results

      - name: 安装 Allure CLI
        if: always()
        run: npm install -g allure-commandline --silent

      - name: 生成 Allure HTML 报告
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: 收集容器日志（排查用）
        if: always()
        run: docker compose logs --no-color > compose-logs.txt || true

      - name: 上传 Allure 报告与排查材料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report
            allure-results
            test-results
            compose-logs.txt
          retention-days: 14

      - name: 停止服务
        if: always()
        run: docker compose down -v
